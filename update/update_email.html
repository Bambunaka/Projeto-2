<!DOCTYPE html>
<html>
    <head>
        <title>Atualizar Usuário</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width, initial-scale=1">
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <body>
        <!-- Cabeçalho | Barra de pesquisa | Foto de perfil login/registro -->
        <header class="container">
            <a href="../mainpage.html"><img src="../img/SampaioBlog.png" alt="Logo do SampaioBlog" class="logo"></a>
            <div id="entrar" class="entrar">
                <a href="../entrar.html" class="entrar">Entrar</a>
                <a href="../perfil.html"><img src="../img/default.png" alt="Foto de perfil" class="Foto"></a>      
            </div> 
        </header>
        
        <!-- Bloco-->
        <section id="bloco" class="bloco_entrar">
            <h2 class="titulo__bloco" alt="Campo para alterar usuário">Alterar e-mail</h2>
            <form>
                <div class="inserir" alt="Inserir e-mail">
                    <label>Novo e-mail</label>
                    <input type="text" id="campo" class="campo" placeholder="digite seu novo e-mail...">
                </div>
                <div class="inserir">
                    <label alt="Confirmar novo e-mail">Confirmar novo e-mail</label>
                    <input type="text" id="campo" class="campo" placeholder="confirme seu novo e-mail..."/>
                </div>
                <div>
                    <button alt="Confirmar">Confirmar</button>
                </div>
                </form>
            </form>
        </section>
    </body>
